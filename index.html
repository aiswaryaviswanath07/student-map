<!DOCTYPE html>
<html>
  <head>
    <title>Student Map</title>

    <!-- Leaflet's styles and code, loaded from the internet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
      body {
        margin: 0;
        font-family: sans-serif;
      }
      h1 {
        margin: 0;
        padding: 12px 16px;
        font-size: 20px;
      }
      #map {
        height: 85vh;
      }
    </style>
  </head>

  <body>
    <h1>Student Map</h1>
    <div id="map"></div>

    <script>
      // Create the map, centered on MEC, zoomed in to street level
      var map = L.map("map").setView([10.0276, 76.3287], 15);

      // Load the OpenStreetMap picture tiles underneath
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© OpenStreetMap contributors",
      }).addTo(map);
    </script>
  </body>
</html>
