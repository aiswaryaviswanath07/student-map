<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
  --ink: #1b1f3b;
  --primary: #2a2f73;
  --accent: #0e7c66;
  --bg: #f5f4fa;
  --line: #d9d6e8;
}
body {
  margin: 0;
  font-family: "Inter", sans-serif;
  background: var(--bg);
  color: var(--ink);
}
h1 {
  margin: 0;
  padding: 16px 20px;
  font-size: 22px;
  font-weight: 700;
  background: var(--primary);
  color: white;
}
#filters, #layers {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  padding: 12px 20px 0;
  font-size: 14px;
}
button {
  padding: 6px 14px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: white;
  color: var(--ink);
  font-family: inherit;
  cursor: pointer;
}
button:hover { border-color: var(--primary); }
button.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
#layers label {
  background: white;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 4px 12px;
  cursor: pointer;
}
#map {
  height: calc(100vh - 230px);
  min-height: 400px;
  margin: 14px 20px 20px;
  border-radius: 14px;
  box-shadow: 0 4px 16px rgba(42, 47, 115, 0.15);
}
    </style>
  </head>

  <body>
    <h1>Student Map</h1>

    <div id="filters">
      <span>Type:</span>
      <button class="cat active" data-cat="all">All</button>
      <button class="cat" data-cat="cafe">Cafe</button>
      <button class="cat" data-cat="food">Food</button>
      <button class="cat" data-cat="library">Library</button>

      <span style="margin-left: 12px">Max price:</span>
      <button class="price active" data-price="9999">Any</button>
      <button class="price" data-price="150">Under ₹150</button>
      <button class="price" data-price="300">Under ₹300</button>
    </div>

    <div id="layers">
  <span>Show:</span>
  <label><input type="checkbox" data-layer="hospital" checked> Hospitals</label>
  <label><input type="checkbox" data-layer="clinic" checked> Clinics</label>
  <label><input type="checkbox" data-layer="college" checked> Colleges</label>
  <label><input type="checkbox" data-layer="busstop" checked> Bus stops</label>
</div>
    <div id="map"></div>

    <script>
      // 1. The map
      var map = L.map("map").setView([10.0276, 76.3287], 15);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© OpenStreetMap contributors",
      }).addTo(map);

      // 2. The places (replace with real ones!)
      var places = [
        { name: "MEC Library", category: "library", price: 0, lat: 10.0276, lng: 76.3287 },
        { name: "Example Cafe", category: "cafe", price: 250, lat: 10.0290, lng: 76.3300 },
        { name: "Example Mess", category: "food", price: 120, lat: 10.0265, lng: 76.3270 }
      ];

      // 3. Remember what filters are chosen right now
      var selectedCategory = "all";
      var maxPrice = 9999;

      // 4. A layer that holds all the markers, so we can clear and redraw them
      var markerLayer = L.layerGroup().addTo(map);

      function showPlaces() {
        markerLayer.clearLayers(); // remove all current markers

        places.forEach(function (place) {
          var categoryOk = selectedCategory === "all" || place.category === selectedCategory;
          var priceOk = place.price <= maxPrice;

          if (categoryOk && priceOk) {
            L.marker([place.lat, place.lng])
              .bindPopup("<b>" + place.name + "</b><br>" + place.category + " · ₹" + place.price)
              .addTo(markerLayer);
          }
        });
      }

      // 5. Make the buttons work
      document.querySelectorAll("button.cat").forEach(function (btn) {
        btn.addEventListener("click", function () {
          selectedCategory = btn.dataset.cat;
          document.querySelectorAll("button.cat").forEach(function (b) { b.classList.remove("active"); });
          btn.classList.add("active");
          showPlaces();
        });
      });

      document.querySelectorAll("button.price").forEach(function (btn) {
        btn.addEventListener("click", function () {
          maxPrice = Number(btn.dataset.price);
          document.querySelectorAll("button.price").forEach(function (b) { b.classList.remove("active"); });
          btn.classList.add("active");
          showPlaces();
        });
      });

      // 6. Draw everything once at the start
      // ---- Real places from OpenStreetMap (via Overpass) ----
var overpassLayers = {
  hospital: { label: "Hospital", color: "#e53e3e", filter: '["amenity"="hospital"]' },
  clinic:   { label: "Clinic",   color: "#dd6b20", filter: '["amenity"~"clinic|doctors"]' },
  college:  { label: "College",  color: "#6b46c1", filter: '["amenity"~"college|university"]' },
  busstop:  { label: "Bus stop", color: "#2f855a", filter: '["highway"="bus_stop"]' }
};

function loadOsmLayer(key) {
  var cfg = overpassLayers[key];
  cfg.group = L.layerGroup().addTo(map);

  // Ask Overpass: "give me all of these within 3 km of MEC"
  var query = '[out:json][timeout:25];nwr' + cfg.filter +
              '(around:3000,10.0276,76.3287);out center tags;';

  fetch("https://overpass-api.de/api/interpreter", {
    method: "POST",
    body: "data=" + encodeURIComponent(query)
  })
    .then(function (response) { return response.json(); })
    .then(function (data) {
      data.elements.forEach(function (el) {
        // Points have lat/lon directly; buildings have a "center"
        var lat = el.lat || (el.center && el.center.lat);
        var lng = el.lon || (el.center && el.center.lon);
        if (!lat || !lng) return;

        var name = (el.tags && el.tags.name) || cfg.label;

        // Build the popup safely as text
        var box = document.createElement("div");
        var title = document.createElement("b");
        title.textContent = name;
        box.appendChild(title);
        box.appendChild(document.createElement("br"));
        box.appendChild(document.createTextNode(cfg.label));

        L.circleMarker([lat, lng], { radius: 6, color: cfg.color, fillOpacity: 0.8 })
          .bindPopup(box)
          .addTo(cfg.group);
      });
    })
    .catch(function (error) { console.log("Overpass problem:", error); });
}

Object.keys(overpassLayers).forEach(loadOsmLayer);

// Checkboxes show/hide each type
document.querySelectorAll("#layers input").forEach(function (box) {
  box.addEventListener("change", function () {
    var group = overpassLayers[box.dataset.layer].group;
    if (box.checked) { map.addLayer(group); } else { map.removeLayer(group); }
  });
});
      showPlaces();
    </script>
  </body>
</html>
